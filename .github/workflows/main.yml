name: Generate SHA256 Hashes for Changed Files

on:
  push:
    paths:
      - 'packages/**'
  pull_request:
    paths:
      - 'packages/**'

permissions:
  contents: write

jobs:
  generate-hashes:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # ensures we can compare with previous commit

      # Step 2: Generate SHA256 hashes for changed files
      - name: Generate SHA256 hashes for changed files
        run: |
          set -e  # exit if any command fails
          HASH_DIR="packages/HASHES"
          mkdir -p "$HASH_DIR"

          # Determine changed files
          if git rev-parse "$GITHUB_SHA^" >/dev/null 2>&1; then
            # Normal case: there is a parent commit
            CHANGED_FILES=$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- packages/ | grep -v "^$HASH_DIR/")
          else
            # First commit or orphan branch: take all files
            CHANGED_FILES=$(git ls-tree -r --name-only "$GITHUB_SHA" -- packages/ | grep -v "^$HASH_DIR/")
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files detected."
            exit 0
          fi

          echo "Changed files detected:"
          echo "$CHANGED_FILES"

          # Loop through changed files
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              relative_path="${file#packages/}"
              hash_subdir="$HASH_DIR/$(dirname "$relative_path")"
              mkdir -p "$hash_subdir"
              sha256sum "$file" | awk '{print $1}' > "$hash_subdir/$(basename "$file")"
              echo "Generated hash for $file -> $hash_subdir/$(basename "$file")"
            fi
          done

      # Step 3: Commit and push hashes if changed
      - name: Commit and push hashes
        if: github.event_name == 'push'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/HASHES/
          if ! git diff --cached --quiet; then
            git commit -m "Update SHA256 hashes for changed files"
            git push
          else
            echo "No changes to commit."
          fi
